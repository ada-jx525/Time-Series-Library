<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980">
  <defs>
    <linearGradient id="top" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#fff7ed"/></linearGradient>
    <linearGradient id="bot" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f0fdf4"/><stop offset="1" stop-color="#eff6ff"/></linearGradient>
    <linearGradient id="blue" x1="0" x2="1"><stop stop-color="#dbeafe"/><stop offset="1" stop-color="#93c5fd"/></linearGradient>
    <linearGradient id="orange" x1="0" x2="1"><stop stop-color="#ffedd5"/><stop offset="1" stop-color="#fdba74"/></linearGradient>
    <linearGradient id="purple" x1="0" x2="1"><stop stop-color="#ede9fe"/><stop offset="1" stop-color="#c4b5fd"/></linearGradient>
    <linearGradient id="green" x1="0" x2="1"><stop stop-color="#dcfce7"/><stop offset="1" stop-color="#86efac"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="4" dy="7" stdDeviation="5" flood-color="#0f172a" flood-opacity=".18"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#475569"/></marker>
    <style>
      .title{font:700 36px Arial,sans-serif;fill:#0f172a}.sec{font:700 27px Arial,sans-serif;fill:#111827}.lab{font:700 19px Arial,sans-serif;fill:#111827}.sm{font:600 15px Arial,sans-serif;fill:#334155}.tiny{font:500 12px Arial,sans-serif;fill:#475569}
      .panel{stroke:#cbd5e1;stroke-width:2;rx:18;ry:18}.box{stroke:#334155;stroke-width:2;rx:12;ry:12;filter:url(#shadow)}.mem{stroke:#ea580c;stroke-width:2;rx:12;ry:12;filter:url(#shadow)}
      .line{stroke:#64748b;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#fb923c;stroke-width:2.5;fill:none;stroke-dasharray:9 7;marker-end:url(#arrow)}.loss{stroke:#2563eb;stroke-width:2.5;fill:none;stroke-dasharray:8 6;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1800" height="980" fill="#fff"/>
  <text x="60" y="60" class="title">BranchWorldModel</text>
  <text x="370" y="60" class="sec">End-to-End Branch-Aware Latent World Model for Time-Series Forecasting</text>
  <rect x="1225" y="24" width="500" height="50" fill="#eff6ff" stroke="#60a5fa" stroke-width="2" rx="12"/>
  <text x="1250" y="55" class="sm">Backbone: trainable temporal encoder, not frozen</text>

  <rect x="45" y="105" width="1710" height="360" fill="url(#top)" class="panel"/>
  <text x="75" y="145" class="sec">Online Forecasting: Retrieved Branches Modulate the Latent Transition Law</text>

  <rect x="80" y="205" width="205" height="140" fill="url(#blue)" class="box"/>
  <text x="112" y="237" class="lab">Look-back Window</text>
  <polyline points="110,305 135,286 160,294 185,260 210,280 235,248 260,263" fill="none" stroke="#0369a1" stroke-width="4"/>
  <polyline points="110,327 135,315 160,321 185,304 210,313 235,292 260,299" fill="none" stroke="#ea580c" stroke-width="4"/>
  <text x="124" y="335" class="tiny">input x[t-L+1:t]</text>

  <rect x="345" y="205" width="245" height="140" fill="url(#blue)" class="box"/>
  <text x="382" y="235" class="lab">Trainable Backbone</text>
  <text x="388" y="262" class="lab">Latent State Encoder</text>
  <rect x="405" y="285" width="125" height="23" fill="#bfdbfe" stroke="#2563eb" rx="5"/><rect x="420" y="306" width="125" height="23" fill="#93c5fd" stroke="#2563eb" rx="5"/>
  <circle cx="390" cy="317" r="18" fill="#2563eb"/><text x="385" y="321" class="tiny" fill="#fff">z</text>
  <text x="374" y="338" class="tiny">retrieval-worthy + transition-aware</text>

  <rect x="660" y="205" width="250" height="140" fill="url(#orange)" class="mem"/>
  <text x="704" y="236" class="lab">Prototype Memory</text>
  <text x="704" y="262" class="sm">Top-K future branches</text>
  <rect x="705" y="282" width="150" height="18" fill="#fed7aa" stroke="#c2410c"/><rect x="717" y="298" width="150" height="18" fill="#fdba74" stroke="#c2410c"/><rect x="729" y="314" width="150" height="18" fill="#fb923c" stroke="#c2410c"/>
  <text x="688" y="340" class="tiny">state prototype + dynamics prototype</text>

  <rect x="985" y="135" width="285" height="95" fill="url(#purple)" class="box"/><text x="1045" y="166" class="lab">Branch 1 Rollout</text><path d="M1030 202 C1070 165 1115 218 1155 194 C1180 180 1208 190 1230 168" fill="none" stroke="#7c3aed" stroke-width="4"/>
  <rect x="985" y="250" width="285" height="95" fill="url(#purple)" class="box"/><text x="1045" y="281" class="lab">Branch k Rollout</text><path d="M1030 318 C1060 285 1110 285 1152 320 C1185 348 1205 302 1230 310" fill="none" stroke="#16a34a" stroke-width="4"/>
  <rect x="985" y="365" width="285" height="95" fill="url(#purple)" class="box"/><text x="1045" y="396" class="lab">Branch K Rollout</text><path d="M1030 430 C1060 425 1095 440 1125 407 C1155 375 1200 390 1230 414" fill="none" stroke="#dc2626" stroke-width="4"/>

  <rect x="1360" y="230" width="190" height="120" fill="url(#green)" class="box"/>
  <text x="1395" y="263" class="lab">MoE Router</text>
  <text x="1386" y="288" class="sm">branch expert weights</text>
  <circle cx="1400" cy="318" r="10" fill="#7c3aed"/><circle cx="1455" cy="305" r="10" fill="#16a34a"/><circle cx="1510" cy="318" r="10" fill="#dc2626"/>
  <path d="M1398 318 C1428 295 1478 295 1512 318" fill="none" stroke="#166534" stroke-width="5"/>

  <rect x="1620" y="235" width="115" height="110" fill="url(#green)" class="box"/>
  <text x="1640" y="270" class="lab">Final</text><text x="1630" y="298" class="lab">Forecast</text>
  <polyline points="1640,326 1660,302 1680,315 1705,286 1720,295" fill="none" stroke="#15803d" stroke-width="4"/>

  <path d="M285 275 345 275" class="line"/><path d="M590 275 660 275" class="line"/>
  <path d="M910 275 C945 205 950 184 985 184" class="line"/><path d="M910 275 985 298" class="line"/><path d="M910 275 C950 355 950 415 985 415" class="line"/>
  <path d="M1270 184 C1320 215 1330 250 1360 286" class="line"/><path d="M1270 298 1360 286" class="line"/><path d="M1270 415 C1320 380 1330 330 1360 286" class="line"/><path d="M1550 290 1620 290" class="line"/>

  <rect x="45" y="505" width="1710" height="395" fill="url(#bot)" class="panel"/>
  <text x="75" y="545" class="sec">Offline Branch Discovery + Joint Training</text>

  <rect x="85" y="620" width="210" height="135" fill="url(#blue)" class="box"/><text x="125" y="650" class="lab">Training Windows</text><text x="125" y="675" class="sm">sliding samples</text>
  <rect x="120" y="700" width="130" height="42" fill="#f8fafc" stroke="#64748b"/><polyline points="128,730 150,714 174,721 198,704 222,718 244,707" fill="none" stroke="#0369a1" stroke-width="3"/>

  <rect x="365" y="620" width="220" height="135" fill="url(#blue)" class="box"/><text x="410" y="650" class="lab">State Encoder</text><text x="392" y="675" class="sm">same trainable backbone</text><circle cx="440" cy="715" r="12" fill="#2563eb"/><circle cx="485" cy="700" r="12" fill="#2563eb"/><circle cx="530" cy="724" r="12" fill="#2563eb"/>

  <rect x="655" y="620" width="250" height="135" fill="url(#green)" class="box"/><text x="700" y="650" class="lab">Future Encoder</text><text x="695" y="675" class="sm">future dynamics codes</text><path d="M705 724 C735 690 765 740 800 706 C830 678 855 728 885 702" fill="none" stroke="#15803d" stroke-width="5"/>

  <rect x="980" y="620" width="275" height="135" fill="url(#orange)" class="mem"/><text x="1020" y="650" class="lab">Neighborhood Search</text><text x="1042" y="675" class="lab">& Clustering</text><circle cx="1040" cy="720" r="8" fill="#7c3aed"/><circle cx="1070" cy="704" r="8" fill="#7c3aed"/><circle cx="1110" cy="730" r="8" fill="#16a34a"/><circle cx="1160" cy="708" r="8" fill="#16a34a"/><circle cx="1200" cy="728" r="8" fill="#dc2626"/>

  <rect x="1335" y="620" width="320" height="135" fill="url(#orange)" class="mem"/><text x="1390" y="650" class="lab">Branch Memory Bank</text><text x="1390" y="675" class="sm">compact prototypes, not raw windows</text><rect x="1395" y="700" width="190" height="20" fill="#fed7aa" stroke="#c2410c"/><rect x="1415" y="718" width="190" height="20" fill="#fdba74" stroke="#c2410c"/><text x="1407" y="714" class="tiny">state proto + dynamics proto</text>

  <path d="M295 690 365 690" class="line"/><path d="M585 690 655 690" class="line"/><path d="M905 690 980 690" class="line"/><path d="M1255 690 1335 690" class="line"/>
  <path d="M1495 620 C1490 500 850 480 785 345" class="dash"/>

  <rect x="315" y="795" width="615" height="70" fill="#fff" stroke="#2563eb" stroke-width="2" stroke-dasharray="10 7" rx="10"/>
  <text x="345" y="823" class="lab">End-to-end training objective</text>
  <text x="345" y="848" class="tiny">forecast loss + latent rollout consistency + oracle branch loss + branch diversity + MoE load balance</text>
  <path d="M930 830 C1040 790 1240 760 1390 735" class="loss"/>

  <rect x="1005" y="795" width="630" height="70" fill="#fff" stroke="#fb923c" stroke-width="2" stroke-dasharray="10 7" rx="10"/>
  <text x="1035" y="823" class="lab">Training output</text>
  <text x="1035" y="848" class="tiny">the final prediction is supervised by MSE/MAE protocol; branch memory is rebuilt from learned latent states during training.</text>
</svg>
